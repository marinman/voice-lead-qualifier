# Fly.io: one app hosts the page, token endpoint, dashboard, and agent worker,
# with a persistent volume for SQLite. See README "Deploy".
app = "voice-lead-qualifier"     # must be globally unique; change if taken
primary_region = "iad"           # near LiveKit Cloud's US region

[build]

[env]
  PORT = "8080"
  VLQ_DATA_DIR = "/data"
  # Guardrails (DEMO_ENABLED, MAX_SESSIONS_PER_DAY, ...) default in code and are
  # changed with `fly secrets set`, which restarts the machine without a rebuild.

[mounts]
  source = "vlq_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The agent worker holds a connection to LiveKit to receive dispatches,
  # so the machine must stay up.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
