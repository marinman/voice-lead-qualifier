<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead Funnel Dashboard</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="wrap">
    <nav class="nav">
      <div class="brand"><span class="brand-mark"></span>Voice AI Readiness</div>
      <a href="/">← Assessment page</a>
    </nav>

    <div class="toolbar">
      <div>
        <div class="eyebrow">Funnel</div>
        <h1>Voice qualification dashboard</h1>
        <div class="small">Every conversation, scored against <code>config/scoring.yaml</code>. Refreshes every 5 seconds.</div>
      </div>
      <label class="small"><input type="checkbox" id="samples" checked> Include reviewer samples</label>
    </div>

    <div class="tiles" id="tiles"></div>

    <h3 class="sub">By source and campaign</h3>
    <div class="card table-card">
      <table class="data">
        <thead><tr><th>Source</th><th>Campaign</th><th class="num">Conversations</th><th class="num">Hot</th><th class="num">Warm</th><th class="num">Low</th><th class="num">Hot rate</th></tr></thead>
        <tbody id="sources"></tbody>
      </table>
    </div>

    <h3 class="sub">Conversations</h3>
    <div class="card table-card">
      <table class="data">
        <thead><tr><th>Date</th><th>Channel</th><th>Source / campaign</th><th class="num">Score</th><th>Tier</th><th>Outcome</th><th>Use case</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

  <div class="drawer-bg" id="drawer-bg"></div>
  <aside class="drawer" id="drawer" aria-label="Conversation detail"></aside>

  <script src="/static/result.js"></script>
  <script src="/static/dashboard.js"></script>
</body>
</html>
